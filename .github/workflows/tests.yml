# This source file was 100% generated by AI (GitHub Copilot)
name: Tests

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/**'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
  workflow_dispatch:

jobs:
  regular-tests:
    name: Run regular tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        working-directory: src
        run: dotnet restore

      - name: Run regular tests
        id: tests
        working-directory: src
        run: dotnet test SemPtr.Tests/SemPtr.Tests.csproj --no-restore --logger "trx;LogFileName=regular-test-results.trx" --results-directory ../TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regular-test-results
          path: TestResults/

      - name: Publish test summary
        if: always()
        run: |
          echo "## Test Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ steps.tests.outcome }}" = "success" ]; then
            echo "- Status: ✅ Passed" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.tests.outcome }}" = "failure" ]; then
            echo "- Status: ❌ Failed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Status: ⚠️ ${{ steps.tests.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "- Artifact: \`regular-test-results\`" >> "$GITHUB_STEP_SUMMARY"

          if ls TestResults/regular-*.trx >/dev/null 2>&1; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### TRX Files" >> "$GITHUB_STEP_SUMMARY"

            for file in TestResults/regular-*.trx; do
              echo "- \`$(basename "$file")\`" >> "$GITHUB_STEP_SUMMARY"
            done
          else
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "No regular TRX test result files were found." >> "$GITHUB_STEP_SUMMARY"
          fi

  abi-tests:
    name: ABI tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            msvc_arch: ''
          - os: ubuntu-24.04-arm
            msvc_arch: ''
          - os: windows-2025
            msvc_arch: x64
          - os: windows-11-arm
            msvc_arch: arm64
          - os: macos-26-intel
            msvc_arch: ''
          - os: macos-26
            msvc_arch: ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Build native ABI library
        shell: bash
        env:
          OUTPUT_DIRECTORY: ${{ runner.temp }}/semptr-abi
        run: |
          mkdir -p "$OUTPUT_DIRECTORY"
          if [ "$RUNNER_OS" = "Windows" ]; then
            pwsh -File tests/Native/SemPtrAbi/build.ps1 -OutputDirectory "$OUTPUT_DIRECTORY"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            bash tests/Native/SemPtrAbi/build.sh "$OUTPUT_DIRECTORY"
          else
            bash tests/Native/SemPtrAbi/build.sh "$OUTPUT_DIRECTORY"
          fi

      - name: Restore
        working-directory: src
        run: dotnet restore

      - name: Run ABI tests
        id: tests
        env:
          SEMPTR_RUN_ABI_TESTS: 'true'
          SEMPTR_ABI_NATIVE_LIBRARY: ${{ runner.os == 'Windows' && format('{0}/semptr-abi/SemPtrAbi.dll', runner.temp) || runner.os == 'macOS' && format('{0}/semptr-abi/libSemPtrAbi.dylib', runner.temp) || format('{0}/semptr-abi/libSemPtrAbi.so', runner.temp) }}
        working-directory: src
        run: dotnet test SemPtr.AbiTests/SemPtr.AbiTests.csproj --no-restore -p:Platform=AnyCPU --logger "trx;LogFileName=abi-test-results.trx" --results-directory ../TestResults

      - name: Upload ABI test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: abi-test-results-${{ matrix.os }}
          path: TestResults/

      - name: Publish ABI test summary
        if: always()
        shell: bash
        run: |
          echo "## ABI Test Results (${{ matrix.os }})" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Status: ${{ steps.tests.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Artifact: \`abi-test-results-${{ matrix.os }}\`" >> "$GITHUB_STEP_SUMMARY"
